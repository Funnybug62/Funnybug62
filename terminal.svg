<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="'SF Mono','Cascadia Code','Fira Code',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1033"/>
      <stop offset="1" stop-color="#0d0920"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d1b4e"/>
      <stop offset="1" stop-color="#3a1b52"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="784" height="344" rx="14" fill="url(#bg)" stroke="#5a3a8a" stroke-width="1.5"/>
  <rect x="8" y="8" width="784" height="42" rx="14" fill="url(#bar)"/>
  <rect x="8" y="36" width="784" height="14" fill="url(#bar)"/>
  <circle cx="34" cy="29" r="7" fill="#ff5f57"/>
  <circle cx="58" cy="29" r="7" fill="#febc2e"/>
  <circle cx="82" cy="29" r="7" fill="#28c840"/>
  <text x="400" y="34" text-anchor="middle" fill="#c9b8e8" font-size="14" font-weight="bold">🐷 originalricemuncher — zsh</text>

  <!-- terminal body -->
  <g font-size="15.5">
    <!-- whoami -->
    <text x="28" y="86" opacity="0">
      <set attributeName="opacity" to="1" begin="0.3s" fill="freeze"/>
      <tspan fill="#50fa7b" font-weight="bold">rice@github</tspan><tspan fill="#f8f8f2">:</tspan><tspan fill="#8be9fd">~</tspan><tspan fill="#f8f8f2">$ whoami</tspan>
    </text>
    <text x="28" y="110" fill="#ff79c6" opacity="0">
      <set attributeName="opacity" to="1" begin="1.0s" fill="freeze"/>» hiya everyone! 👋 this is my github</text>

    <!-- cat about.txt -->
    <text x="28" y="146" opacity="0">
      <set attributeName="opacity" to="1" begin="1.7s" fill="freeze"/>
      <tspan fill="#50fa7b" font-weight="bold">rice@github</tspan><tspan fill="#f8f8f2">:</tspan><tspan fill="#8be9fd">~</tspan><tspan fill="#f8f8f2">$ cat about.txt</tspan>
    </text>
    <text x="28" y="170" fill="#f1fa8c" opacity="0">
      <set attributeName="opacity" to="1" begin="2.4s" fill="freeze"/>» i just like to share some cool projects i make on here</text>

    <!-- ls ~/interests -->
    <text x="28" y="206" opacity="0">
      <set attributeName="opacity" to="1" begin="3.1s" fill="freeze"/>
      <tspan fill="#50fa7b" font-weight="bold">rice@github</tspan><tspan fill="#f8f8f2">:</tspan><tspan fill="#8be9fd">~</tspan><tspan fill="#f8f8f2">$ ls ~/interests</tspan>
    </text>
    <text x="28" y="230" fill="#bd93f9" opacity="0">
      <set attributeName="opacity" to="1" begin="3.8s" fill="freeze"/>» 🐷  pigs   🐷🐷  more-pigs   🐷🐷🐷  even-more-pigs</text>

    <!-- echo -->
    <text x="28" y="266" opacity="0">
      <set attributeName="opacity" to="1" begin="4.5s" fill="freeze"/>
      <tspan fill="#50fa7b" font-weight="bold">rice@github</tspan><tspan fill="#f8f8f2">:</tspan><tspan fill="#8be9fd">~</tspan><tspan fill="#f8f8f2">$ echo "thanks for stopping by!"</tspan>
    </text>
    <text x="28" y="290" fill="#ff79c6" opacity="0">
      <set attributeName="opacity" to="1" begin="5.2s" fill="freeze"/>» thanks for stopping by! ✨</text>

    <!-- final prompt + blinking cursor -->
    <text x="28" y="326" opacity="0">
      <set attributeName="opacity" to="1" begin="5.9s" fill="freeze"/>
      <tspan fill="#50fa7b" font-weight="bold">rice@github</tspan><tspan fill="#f8f8f2">:</tspan><tspan fill="#8be9fd">~</tspan><tspan fill="#f8f8f2">$ </tspan><tspan fill="#ff79c6">█<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="6.3s" repeatCount="indefinite"/></tspan>
    </text>
  </g>
</svg>
